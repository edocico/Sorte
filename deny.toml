# cargo deny check: licences compatible with GPL-3.0-only, known vulnerabilities, and
# crates from crates.io only (CLAUDE.md, "Dependencies, privacy, licensing").

[graph]
all-features = false

[advisories]
yanked = "warn"

[licenses]
# Only licences compatible with GPL-3.0-only. Slint, offered as GPL-3.0-only OR its own
# licences, is taken under GPL-3.0-only.
allow = [
    "GPL-3.0-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9
# Licences of crates not in the graph yet (Slint, Vello, Kira come with later crates).
unused-allowed-license = "allow"

[bans]
# Slint brings its own parley and fontique next to ours: duplicates are expected.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
